name: Release
on:
  workflow_dispatch:
concurrency:
  group: release
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci && npm run build && npm test && npm run lint
      - name: Bump, tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(node -p "require('./package.json').version")
          node bin/cli.js --bump
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == "$previous" ]]; then exit 0; fi
          tag="v$version"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): $tag"
          git tag "$tag"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          npm publish
          gh release create "$tag" --verify-tag --title "changelog-machine $tag" --generate-notes
